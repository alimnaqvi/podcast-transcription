[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "podcast-transcriber"
version = "0.1.0"
description = "A local CLI for transcribing podcast episodes"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "faster-whisper>=1.1",
    "av>=11,<19",
]

[project.optional-dependencies]
cuda = [
    "nvidia-cublas-cu12",
    "nvidia-cudnn-cu12>=9,<10",
]

[project.scripts]
podcast-tx = "podcast_transcriber.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
